[extend]
useDefault = true

# Match the reviewed non-secret as well as its file, so unrelated credentials in these files still fail.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Vendored foundation content hashes"
condition = "AND"
paths = ['''^contracts/foundation/manifest\.json$''']
regexTarget = "match"
regexes = ['''^(?:openapi\.json|mobile\.openapi\.json|swift\.openapi\.json|tokens\.json|tokens\.ts|DADTokens\.swift|DADTokens\.kt)": "[a-f0-9]{64}"$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic application idempotency key"
condition = "AND"
paths = ['''^Tests/DADFoundationTests/ApplicationSubmitTests\.swift$''']
regexTarget = "match"
regexes = ['''^idempotencyKey: "4c3b8f0e-7a1d-4e55-9f2a-0b1c2d3e4f50"$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "DEBUG stub claim token"
condition = "AND"
paths = ['''^UITests/CredentialAuthFlowTests\.swift$''']
regexTarget = "match"
regexes = ['''^token=stubclaim0123456789abcdef0123456789abcdef"$''']
